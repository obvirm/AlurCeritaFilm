<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glitch-outline" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate"
                    radius="var(--tscaps-outline-thickness, 0.08)em" result="outline-shape"/>
      <feFlood flood-color="var(--tscaps-outline-color, #0a0a0a)" result="outline-ink"/>
      <feComposite in="outline-ink" in2="outline-shape" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <filter id="glitch" x="-20%" y="-15%" width="140%" height="130%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.02 var(--tscaps-displacement-frequency, 0.75)"
        numOctaves="2"
        seed="var(--tscaps-tick-60, 1)"
        result="rawNoise"
      />
      <feComponentTransfer in="rawNoise" result="noise">
        <feFuncR type="discrete" tableValues="0 0.35 0.65 1"/>
        <feFuncG type="linear" slope="0" intercept="0.5"/>
      </feComponentTransfer>

      <feDisplacementMap in="SourceGraphic" in2="noise" scale="var(--tscaps-displacement-amount, 9)" xChannelSelector="R" yChannelSelector="G" result="displacedSrc"/>
      <feDisplacementMap in="SourceAlpha" in2="noise" scale="var(--tscaps-displacement-amount, 9)" xChannelSelector="R" yChannelSelector="G" result="displacedAlpha"/>

      <feOffset in="displacedAlpha" dx="var(--tscaps-split-x, 0.05)em" dy="0em" result="split-a-shape"/>
      <feFlood flood-color="var(--tscaps-split-color-a, #ff0044)" result="split-a-ink"/>
      <feComposite in="split-a-ink" in2="split-a-shape" operator="in" result="split-a"/>
      <feOffset in="displacedAlpha" dx="-var(--tscaps-split-x, 0.05)em" dy="-0em" result="split-b-shape"/>
      <feFlood flood-color="var(--tscaps-split-color-b, #00f4ff)" result="split-b-ink"/>
      <feComposite in="split-b-ink" in2="split-b-shape" operator="in" result="split-b"/>

      <feMerge>
        <feMergeNode in="split-a"/>
        <feMergeNode in="split-b"/>
        <feMergeNode in="displacedSrc"/>
      </feMerge>
    </filter>
  </defs>
</svg>
