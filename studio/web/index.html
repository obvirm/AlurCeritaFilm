<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>movie2short — Opus Green</title>
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6FDF6" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("m2s:theme");
          var theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>
      .app-boot-splash {
        position: fixed;
        inset: 0;
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        font-size: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #f5f5f5;
      }
      [data-theme="light"] .app-boot-splash {
        background: #f6fdf6;
        color: #0a1f0a;
      }
      .app-boot-splash__accent { color: #b6ff3b; text-shadow: 0 0 12px rgba(182,255,59,0.5); }
      .app-boot-splash__dot {
        color: #b6ff3b;
        margin-left: 2px;
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" role="status" aria-label="Loading">
        <span>movie<span class="app-boot-splash__accent">2</span>short<span class="app-boot-splash__dot">.</span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
